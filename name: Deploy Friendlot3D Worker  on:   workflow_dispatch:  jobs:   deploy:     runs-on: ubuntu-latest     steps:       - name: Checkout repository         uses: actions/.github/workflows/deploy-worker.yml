name: Deploy Friendlot3D Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check Worker source exists
        run: test -s worker-live.js
      - name: Wait for verified production source
        run: |
          echo 'Automatic deployment is intentionally disabled until worker-live.js matches the production Worker.'
          exit 1
