<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10152b"><title>ログイン・新規登録 | FRIENDLOT 3D</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(145deg,#11182b,#243d55);color:#fff;font-family:system-ui,-apple-system,sans-serif}.card{width:min(420px,100%);background:#111827f5;border:1px solid #ffffff30;border-radius:22px;padding:24px;box-shadow:0 20px 70px #0008}h1{text-align:center;font-size:25px;margin:4px 0}p.sub{text-align:center;color:#b8c5dc;font-size:13px}label{display:block;font-size:13px;margin:14px 0 5px}input{width:100%;padding:12px;border-radius:10px;background:#202b40;color:white;border:1px solid #ffffff50;font:inherit}button{width:100%;margin-top:16px;background:#4f8dff;color:#fff;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:800}button:disabled{opacity:.6}a{color:#8fbcff}#message{font-size:13px;color:#ffd58a;min-height:20px;white-space:pre-wrap}.foot{text-align:center;font-size:13px;color:#b8c5dc}</style></head><body><main class="card"><div style="text-align:center;font-size:42px">🥝</div><h1>FRIENDLOT 3D</h1><p class="sub" id="subtitle">ログインして冒険を続けよう！</p><div style="display:flex;gap:8px;margin:18px 0 12px"><button id="loginTab" type="button" style="margin-top:0;background:#4f8dff">ログイン</button><button id="registerTab" type="button" style="margin-top:0;background:#46536c">新規登録</button></div><form id="form"><label for="id">ユーザーID</label><input id="id" name="id" autocomplete="username" maxlength="24" minlength="3" pattern="[A-Za-z0-9_]{3,24}" placeholder="英数字と _（3〜24文字）" required><label for="password">パスワード</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" placeholder="8文字以上" required><div id="confirmWrap" style="display:none"><label for="confirm">パスワード（確認）</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="もう一度入力"></div><button id="submit" type="submit">ログイン</button></form><p id="message" role="status"></p></main><script>
const API='https://riendlot3d-api.kazu31-t10.workers.dev';
const form=document.querySelector('#form'),button=document.querySelector('#submit'),message=document.querySelector('#message');
let mode='login';
if(sessionStorage.getItem('friendlot3d_token')&&sessionStorage.getItem('friendlot3d_id'))location.replace('./index.html');
function setMode(next){mode=next;const registering=mode==='register';document.querySelector('#loginTab').style.background=registering?'#46536c':'#4f8dff';document.querySelector('#registerTab').style.background=registering?'#4f8dff':'#46536c';document.querySelector('#subtitle').textContent=registering?'新しい冒険を始めよう！':'ログインして冒険を続けよう！';button.textContent=registering?'アカウントを作成':'ログイン';document.querySelector('#confirmWrap').style.display=registering?'block':'none';document.querySelector('#confirm').required=registering;document.querySelector('#password').autocomplete=registering?'new-password':'current-password';message.textContent=''}
document.querySelector('#loginTab').addEventListener('click',()=>setMode('login'));
document.querySelector('#registerTab').addEventListener('click',()=>setMode('register'));
form.addEventListener('submit',async e=>{e.preventDefault();const id=document.querySelector('#id').value.trim(),password=document.querySelector('#password').value;if(!/^[A-Za-z0-9_]{3,24}$/.test(id)){message.textContent='ユーザーIDは英数字と _ の3〜24文字にしてね。';return}if(password.length<8){message.textContent='パスワードは8文字以上にしてね。';return}if(mode==='register'&&password!==document.querySelector('#confirm').value){message.textContent='パスワードが一致しません。';return}button.disabled=true;message.textContent=mode==='register'?'アカウント作成中…':'ログイン中…';try{const endpoint=mode==='register'?'/api/auth/register':'/api/auth/login';const res=await fetch(API+endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,password})});const data=await res.json().catch(()=>({error:'サーバー応答を読み取れませんでした'}));if(!res.ok)throw new Error(data.error||(mode==='register'?'登録できませんでした':'ログインできませんでした'));if(!data.token||!data.id)throw new Error('サーバー応答にログイン情報がありません');sessionStorage.setItem('friendlot3d_token',data.token);sessionStorage.setItem('friendlot3d_id',data.id);location.replace('./index.html')}catch(err){message.textContent=err.message+'\n接続できない場合はWorkerのCORS設定も確認してね。'}finally{button.disabled=false}});
</script></body></html>
