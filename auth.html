<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10152b">
<title>ログイン・新規登録 | FRIENDLOT 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(145deg,#11182b,#243d55);color:#fff;font-family:system-ui,-apple-system,sans-serif}
.card{width:min(420px,100%);background:#111827f5;border:1px solid #ffffff30;border-radius:22px;padding:24px;box-shadow:0 20px 70px #0008}
h1{text-align:center;font-size:25px;margin:4px 0}
p.sub{text-align:center;color:#b8c5dc;font-size:13px}
label{display:block;font-size:13px;margin:14px 0 5px}
input{width:100%;padding:12px;border-radius:10px;background:#202b40;color:white;border:1px solid #ffffff50;font:inherit}
button{width:100%;margin-top:16px;background:#4f8dff;color:#fff;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:800}
button:disabled{opacity:.6}
#message{font-size:13px;color:#ffd58a;min-height:20px;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<main class="card">
  <div style="text-align:center;font-size:42px">🥝</div>
  <h1>FRIENDLOT 3D</h1>
  <p class="sub" id="subtitle">ログインして冒険を続けよう！</p>
  <div style="display:flex;gap:8px;margin:18px 0 12px">
    <button id="loginTab" type="button" style="margin-top:0;background:#4f8dff">ログイン</button>
    <button id="registerTab" type="button" style="margin-top:0;background:#46536c">新規登録</button>
  </div>
  <form id="form">
    <label for="id">ユーザーID</label>
    <input id="id" name="id" autocomplete="username" maxlength="24" minlength="3" pattern="[A-Za-z0-9_]{3,24}" placeholder="英数字と _（3〜24文字）" required>
    <label for="password">パスワード</label>
    <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" placeholder="8文字以上" required>
    <div id="confirmWrap" style="display:none">
      <label for="confirm">パスワード（確認）</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="もう一度入力">
    </div>
    <button id="submit" type="submit">ログイン</button>
  </form>
  <p id="message" role="status" aria-live="polite"></p>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL='https://yxonmqdyekwenyzekjwj.supabase.co';
const SUPABASE_KEY='sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ';
const db=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const form = document.querySelector('#form');
const button = document.querySelector('#submit');
const message = document.querySelector('#message');
const idInput = document.querySelector('#id');
const passwordInput = document.querySelector('#password');
const confirmInput = document.querySelector('#confirm');
let mode = 'login';

if (sessionStorage.getItem('friendlot3d_supabase_session') && sessionStorage.getItem('friendlot3d_id')) {
  location.replace('./index.html');
}

function setMode(next) {
  mode = next;
  const registering = mode === 'register';
  document.querySelector('#loginTab').style.background = registering ? '#46536c' : '#4f8dff';
  document.querySelector('#registerTab').style.background = registering ? '#4f8dff' : '#46536c';
  document.querySelector('#subtitle').textContent = registering ? '新しい冒険を始めよう！' : 'ログインして冒険を続けよう！';
  button.textContent = registering ? 'アカウントを作成' : 'ログイン';
  document.querySelector('#confirmWrap').style.display = registering ? 'block' : 'none';
  confirmInput.required = registering;
  passwordInput.autocomplete = registering ? 'new-password' : 'current-password';
  message.textContent = '';
}
document.querySelector('#loginTab').addEventListener('click', () => setMode('login'));
document.querySelector('#registerTab').addEventListener('click', () => setMode('register'));

form.addEventListener('submit', async event => {
  event.preventDefault();
  const id = idInput.value.trim();
  const password = passwordInput.value;
  if (!/^[A-Za-z0-9_]{3,24}$/.test(id)) {
    message.textContent = 'ユーザーIDは英数字と _ の3〜24文字にしてね。';
    return;
  }
  if (password.length < 8 || password.length > 128) {
    message.textContent = 'パスワードは8〜128文字にしてね。';
    return;
  }
  if (mode === 'register' && password !== confirmInput.value) {
    message.textContent = 'パスワードが一致しません。';
    return;
  }

  button.disabled = true;
  message.textContent = mode === 'register' ? 'アカウント作成中…' : 'ログイン中…';

  try {
    const username=id;
    const {data:bannedData,error:bannedError}=await db.rpc('check_user_banned',{target_username:username});
    if(bannedError)throw bannedError;
    if(bannedData===true||bannedData?.banned)throw new Error('このアカウントは現在利用できません。');
    const {data,error}=await db.functions.invoke('auth',{body:{action:mode==='register'?'register':'login',username,password}});
    if(error)throw new Error(error.message||'認証に失敗しました');
    if(!data?.session?.access_token||!data?.session?.refresh_token)throw new Error(data?.error||'ログイン情報が返されませんでした。');
    const session=data.session;
    const {error:setError}=await db.auth.setSession({access_token:session.access_token,refresh_token:session.refresh_token});
    if(setError)throw setError;
    sessionStorage.setItem('friendlot3d_supabase_session',JSON.stringify({access_token:session.access_token,refresh_token:session.refresh_token}));
    sessionStorage.setItem('friendlot3d_id',String(data.username||data.user?.user_metadata?.username||username));
    sessionStorage.removeItem('friendlot3d_token');
    location.replace('./index.html');
  } catch (error) {
    message.textContent = error.message || '予期しないエラーが発生しました。';
    console.error('FRIENDLOT 3D auth error:', error);
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
