<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10152b">
<title>Friendlot 3D</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10152b;font-family:system-ui,-apple-system,sans-serif;color:#fff}
#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:#10152bd9;border:1px solid #ffffff24;border-radius:14px;padding:10px 13px;box-shadow:0 8px 30px #0004;backdrop-filter:blur(8px)}
#brand{position:absolute;top:12px;left:12px;font-weight:800;font-size:17px}
#status{position:absolute;top:58px;left:12px;max-width:70vw;font-size:12px;color:#d7e2ff}
#hint{position:absolute;top:12px;right:12px;font-size:12px;max-width:45vw;text-align:right}
#roster{position:absolute;left:12px;bottom:16px;max-width:min(54vw,280px);font-size:12px;line-height:1.55}
#roster strong{display:block;margin-bottom:4px}
#joystick{position:absolute;left:20px;bottom:100px;width:116px;height:116px;border-radius:50%;background:#ffffff12;border:2px solid #ffffff3b;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:46px;height:46px;left:33px;top:33px;border-radius:50%;background:#dbe7ffb8;border:2px solid white;box-shadow:0 3px 12px #0006}
#jump{position:absolute;right:22px;bottom:38px;width:76px;height:76px;border-radius:50%;border:2px solid #ffffff80;background:#6e63f0d9;color:white;font-weight:800;font-size:14px;pointer-events:auto;touch-action:manipulation}
#jump:active{transform:scale(.96)}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#10152b;font-weight:700}
#loading small{display:block;color:#b8c5eb;font-weight:400;margin-top:8px;text-align:center}
#error{color:#ffb6b6;white-space:pre-wrap}
@media(min-width:800px){#joystick{display:none}#hint{font-size:14px}#roster{font-size:14px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="brand" class="panel">🌀 FRIENDLOT 3D <span style="color:#9faaff">ALPHA</span></div>
  <div id="status" class="panel">ワールドを準備中…</div>
  <div id="hint" class="panel">PC: WASD / 矢印キーで移動<br>スマホ: 左のパッドで移動・右のボタンでジャンプ</div>
  <div id="roster" class="panel"><strong>キャラクター図鑑</strong><span id="characters">読み込み中…</span></div>
  <div id="joystick"><div id="stick"></div></div>
  <button id="jump">JUMP</button>
  <div id="loading">FRIENDLOT 3D<div><small>3Dワールドを読み込んでいます…</small><small id="error"></small></div></div>
</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const statusEl=document.querySelector('#status');
const loading=document.querySelector('#loading');
const errorEl=document.querySelector('#error');
const charactersEl=document.querySelector('#characters');
let scene,camera,renderer,player,clock,worldObjects=[];
const keys=new Set();
const velocity=new THREE.Vector3();
let yaw=0, jumping=false, jumpVelocity=0;
const move={x:0,y:0};

function makeCharacter(data,index){
  const group=new THREE.Group();
  const color=new THREE.Color(data.color||'#8f7cff');
  const body=new THREE.Mesh(new THREE.SphereGeometry(.55,24,18),new THREE.MeshStandardMaterial({color,roughness:.62}));
  body.position.y=.8;body.scale.set(1,1.08,.88);group.add(body);
  const belly=new THREE.Mesh(new THREE.SphereGeometry(.31,20,14),new THREE.MeshStandardMaterial({color:data.accent||'#f4d7a1',roughness:.8}));
  belly.position.set(0,.67,.39);belly.scale.set(1,.85,.38);group.add(belly);
  for(const x of [-.19,.19]){
    const eye=new THREE.Mesh(new THREE.SphereGeometry(.065,12,10),new THREE.MeshStandardMaterial({color:'#17172a'}));
    eye.position.set(x,1.02,.49);group.add(eye);
    const shine=new THREE.Mesh(new THREE.SphereGeometry(.02,8,8),new THREE.MeshBasicMaterial({color:'#ffffff'}));
    shine.position.set(x-.02,1.045,.54);group.add(shine);
  }
  const footMat=new THREE.MeshStandardMaterial({color:data.accent||'#f4d7a1'});
  for(const x of [-.23,.23]){
    const foot=new THREE.Mesh(new THREE.SphereGeometry(.18,12,10),footMat);
    foot.position.set(x,.2,.02);foot.scale.set(1,.7,1.25);group.add(foot);
  }
  group.userData={...data};
  return group;
}
function addTree(x,z){
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.13,.18,1.2,8),new THREE.MeshStandardMaterial({color:'#765039'}));
  trunk.position.set(x,.6,z);scene.add(trunk);
  const crown=new THREE.Mesh(new THREE.SphereGeometry(.65,12,10),new THREE.MeshStandardMaterial({color:'#39b77a'}));
  crown.position.set(x,1.55,z);scene.add(crown);
}
function init(){
  scene=new THREE.Scene();scene.background=new THREE.Color('#8bd8ff');scene.fog=new THREE.Fog('#8bd8ff',24,70);
  camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,150);
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;
  document.querySelector('#game').appendChild(renderer.domElement);
  scene.add(new THREE.HemisphereLight('#eaf7ff','#56604b',2));
  const sun=new THREE.DirectionalLight('#fff4d7',2.3);sun.position.set(-8,14,7);sun.castShadow=true;scene.add(sun);
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshStandardMaterial({color:'#6bc17e',roughness:1}));
  ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
  const grid=new THREE.GridHelper(100,50,'#ffffff44','#ffffff20');grid.position.y=.015;scene.add(grid);
  const path=new THREE.Mesh(new THREE.PlaneGeometry(5,70),new THREE.MeshStandardMaterial({color:'#d7c39b'}));path.rotation.x=-Math.PI/2;path.position.set(0,.025,-12);scene.add(path);
  for(let i=0;i<28;i++){const x=(Math.random()-.5)*42,z=(Math.random()-.5)*42;if(Math.abs(x)<4&&z<8&&z>-25)continue;addTree(x,z);}
  player=new THREE.Group();
  const avatar=makeCharacter({name:'プレイヤー',color:'#7e75ff',accent:'#fff0b6'},0);player.add(avatar);scene.add(player);
  player.position.set(0,0,5);
  camera.position.set(0,5,11);clock=new THREE.Clock();
  loadCharacters();
  window.addEventListener('resize',resize);
  window.addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key===' ')jump();});
  window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
  document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump();});
  setupJoystick();
  loading.style.display='none';statusEl.textContent='探索開始！ 草原を自由に歩き回ろう。';
  animate();
}
async function loadCharacters(){
  try{
    const res=await fetch('./character.json',{cache:'no-cache'});
    if(!res.ok)throw new Error('character.json が見つかりません');
    const data=await res.json();
    const list=Array.isArray(data.characters)?data.characters:[];
    charactersEl.innerHTML=list.slice(0,6).map(c=>`${escapeHtml(c.emoji||'⭐')} ${escapeHtml(c.name||'名前なし')}`).join('<br>')||'キャラ未登録';
    const positions=[[-4,-5],[4,-7],[-6,-12],[6,-14],[-3,-19],[3,-22]];
    list.slice(0,6).forEach((c,i)=>{
      const model=makeCharacter(c,i);model.position.set(positions[i][0],0,positions[i][1]);scene.add(model);
      const label=makeLabel(c.name||'キャラ');label.position.set(0,1.75,0);model.add(label);
      worldObjects.push({model,baseY:0,phase:Math.random()*6});
    });
    statusEl.textContent=`ワールド準備完了！ キャラ ${list.length}体 / 移動して探索しよう`;
  }catch(e){charactersEl.textContent='character.json を確認してね';statusEl.textContent='基本ワールドは遊べます。キャラデータを読み込めませんでした。';}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function makeLabel(text){
  const canvas=document.createElement('canvas');canvas.width=512;canvas.height=96;
  const ctx=canvas.getContext('2d');ctx.fillStyle='#10152bd9';ctx.beginPath();ctx.roundRect(8,8,496,80,22);ctx.fill();
  ctx.strokeStyle='#ffffff70';ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 32px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(text).slice(0,22),256,48);
  const tex=new THREE.CanvasTexture(canvas);const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  sprite.scale.set(2.8,.53,1);return sprite;
}
function setupJoystick(){
  const pad=document.querySelector('#joystick'),stick=document.querySelector('#stick');let active=false,id=null;
  function set(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=35,l=Math.hypot(dx,dy)||1;if(l>max){dx=dx/l*max;dy=dy/l*max;}move.x=dx/max;move.y=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`;}
  pad.addEventListener('pointerdown',e=>{active=true;id=e.pointerId;pad.setPointerCapture(id);set(e);});
  pad.addEventListener('pointermove',e=>{if(active&&e.pointerId===id)set(e);});
  function end(){active=false;id=null;move.x=move.y=0;stick.style.transform='translate(0,0)';}
  pad.addEventListener('pointerup',end);pad.addEventListener('pointercancel',end);
}
function jump(){if(!jumping){jumping=true;jumpVelocity=6.5;}}
function animate(){
  requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);
  let x=move.x,z=move.y;
  if(keys.has('a')||keys.has('arrowleft'))x-=1;if(keys.has('d')||keys.has('arrowright'))x+=1;
  if(keys.has('w')||keys.has('arrowup'))z-=1;if(keys.has('s')||keys.has('arrowdown'))z+=1;
  const len=Math.hypot(x,z);if(len>1){x/=len;z/=len;}
  player.position.x+=x*7*dt;player.position.z+=z*7*dt;
  player.position.x=THREE.MathUtils.clamp(player.position.x,-48,48);player.position.z=THREE.MathUtils.clamp(player.position.z,-48,48);
  if(len>.05){player.rotation.y=Math.atan2(x,z);player.children[0].position.y=.8+Math.sin(performance.now()*.012)*.045;}
  if(jumping){player.position.y+=jumpVelocity*dt;jumpVelocity-=16*dt;if(player.position.y<=0){player.position.y=0;jumping=false;jumpVelocity=0;}}
  worldObjects.forEach(o=>{o.model.position.y=o.baseY+Math.sin(performance.now()*.0015+o.phase)*.12;o.model.rotation.y+=dt*.35;});
  const target=new THREE.Vector3(player.position.x,player.position.y+1,player.position.z);
  const behind=new THREE.Vector3(Math.sin(player.rotation.y)*8,4.3,Math.cos(player.rotation.y)*8);
  const desired=target.clone().add(behind);camera.position.lerp(desired,1-Math.exp(-4*dt));camera.lookAt(target);
  renderer.render(scene,camera);
}
function resize(){if(!camera||!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
try{init();}catch(e){errorEl.textContent=e.message;loading.style.display='grid';}
</script>
</body>
</html>
