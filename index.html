let stick=$('#stick'),pad=$('#stickpad');function joyStart(e){e.preventDefault();let r=pad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,max=35,len=Math.hypot(x,y)||1;let k=Math.min(1,max/len);joy.x=x*k/max;joy.y=y*k/max;stick.style.transform=`translate(${joy.x*35}px,${joy.y*35}px)`}pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);joyStart(e)});pad.addEventListener('pointermove',e=>{if(e.buttons)joyStart(e)});for(let ev of ['pointerup','pointercancel'])pad.addEventListener(ev,()=>{joy.x=joy.y=0;stick.style.transform=''});

// カメラ操作：ドラッグ/スワイプで回転、ホイール/ピンチでズーム
let cameraMode='third', cameraYaw=0, cameraPitch=0.48, cameraDistance=10;
const cameraPointers=new Map();
let pinchStartDistance=0, pinchStartZoom=10, lastDragX=0, lastDragY=0, dragPointer=null;
const cameraCanvas=renderer.domElement;
const cameraButton=$('#cameraMode');
function updateCameraButton(){
 cameraButton.textContent=cameraMode==='third'?'👁️ 一人称に切替':'🌎 三人称に切替';
}
cameraButton.addEventListener('click',()=>{
 cameraMode=cameraMode==='third'?'first':'third';
 updateCameraButton();
 say(cameraMode==='first'?'一人称視点':'三人称視点');
});

function pointerDistance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
cameraCanvas.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'&&e.button!==0)return;
 cameraPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(cameraPointers.size===1){
  dragPointer=e.pointerId;lastDragX=e.clientX;lastDragY=e.clientY;
 }
 if(cameraPointers.size===2){
  const p=[...cameraPointers.values()];
  pinchStartDistance=pointerDistance(p[0],p[1]);pinchStartZoom=cameraDistance;dragPointer=null;
 }
 if(e.pointerType!=='mouse'&&cameraCanvas.setPointerCapture)cameraCanvas.setPointerCapture(e.pointerId);
});
cameraCanvas.addEventListener('pointermove',e=>{
 if(!cameraPointers.has(e.pointerId))return;
 cameraPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(cameraPointers.size>=2){
  const p=[...cameraPointers.values()],d=pointerDistance(p[0],p[1]);
  if(pinchStartDistance>0)cameraDistance=THREE.MathUtils.clamp(pinchStartZoom*(pinchStartDistance/Math.max(1,d)),3,22);
  return;
 }
 if(dragPointer===e.pointerId){
  const dx=e.clientX-lastDragX,dy=e.clientY-lastDragY;
  cameraYaw-=dx*.006;
  cameraPitch=THREE.MathUtils.clamp(cameraPitch+dy*.005,-.05,1.25);
  lastDragX=e.clientX;lastDragY=e.clientY;
 }
});
function endCameraPointer(e){
 cameraPointers.delete(e.pointerId);
 if(cameraPointers.size<2){pinchStartDistance=0;pinchStartZoom=cameraDistance}
 if(dragPointer===e.pointerId)dragPointer=null;
 if(cameraPointers.size===1){
  const entry=[...cameraPointers.entries()][0];
  dragPointer=entry[0];lastDragX=entry[1].x;lastDragY=entry[1].y;
 }
}
cameraCanvas.addEventListener('pointerup',endCameraPointer);
cameraCanvas.addEventListener('pointercancel',endCameraPointer);
cameraCanvas.addEventListener('wheel',e=>{
 e.preventDefault();
 cameraDistance=THREE.MathUtils.clamp(cameraDistance*Math.exp(e.deltaY*.001),3,22);
},{passive:false});

let last=performance.now(),spawnTimer=0,uiTimer=0;
function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-last)/1000);last=now;
const strafe=(keys.has('d')?1:0)-(keys.has('a')?1:0)+joy.x;const forward=(keys.has('s')?1:0)-(keys.has('w')?1:0)+joy.y;let x=strafe*Math.cos(cameraYaw)+forward*Math.sin(cameraYaw),z=strafe*Math.sin(cameraYaw)-forward*Math.cos(cameraYaw);let len=Math.hypot(x,z);if(len>1){x/=len;z/=len}if(len>.05){player.position.x+=x*7*dt;player.position.z+=z*7*dt;playerBody.rotation.y=Math.atan2(x,z)}player.position.x=THREE.MathUtils.clamp(player.position.x,-31,31);player.position.z=THREE.MathUtils.clamp(player.position.z,-31,31);
for(let o of laneChars){o.progress+=dt*.07;o.g.position.z=-15+((o.progress*30)%30);o.g.position.y=.05+Math.sin(now*.004+o.progress*8)*.08;o.g.rotation.y=Math.PI}
spawnTimer+=dt;if(spawnTimer>5&&laneChars.length<5){spawnTimer=0;laneSpawn()}
bank+=incomeRate()*dt;uiTimer+=dt;if(uiTimer>.2){uiTimer=0;updateUI()}
if(cameraMode==='first'){
 playerBody.visible=false;
 // 目線位置を直接設定し、近くの建物で視点が遅れてめり込むのを防ぐ
 const eye=new THREE.Vector3(player.position.x,player.position.y+1.52,player.position.z);
 camera.position.copy(eye);
 const dir=new THREE.Vector3(
  Math.sin(cameraYaw)*Math.cos(cameraPitch),
  Math.sin(cameraPitch),
  -Math.cos(cameraYaw)*Math.cos(cameraPitch)
 );
 camera.lookAt(eye.clone().add(dir.multiplyScalar(12)));
}else{
 playerBody.visible=true;
 const target=new THREE.Vector3(player.position.x,player.position.y+1,player.position.z);
 const horizontal=Math.cos(cameraPitch)*cameraDistance;
 const desired=new THREE.Vector3(
  player.position.x-Math.sin(cameraYaw)*horizontal,
  player.position.y+1+Math.sin(cameraPitch)*cameraDistance,
  player.position.z+Math.cos(cameraYaw)*horizontal
 );
 // ベースの壁などがカメラとプレイヤーの間にある場合、壁の手前にカメラを寄せる
 const offset=desired.clone().sub(target);
 const desiredDistance=offset.length();
 const rayDirection=offset.clone().normalize();
 const raycaster=new THREE.Raycaster(target,rayDirection,0.25,desiredDistance);
 const blockers=scene.children.filter(o=>o!==player);
 const hits=raycaster.intersectObjects(blockers,true);
 let safeDistance=desiredDistance;
 if(hits.length) safeDistance=Math.max(0.8,Math.min(desiredDistance,hits[0].distance-0.45));
 const safePosition=target.clone().add(rayDirection.multiplyScalar(safeDistance));
 camera.position.lerp(safePosition,.28);
 camera.lookAt(target);
}
renderer.render(scene,camera)}
